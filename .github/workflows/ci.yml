name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: zig build test

      - name: Compile C header consumer
        run: zig cc -std=c11 -I. -c tests/header_consumer.c -o "$RUNNER_TEMP/dim-header-consumer.o"

      - name: Build WebAssembly artifact
        run: zig build wasm -Doptimize=ReleaseSmall

      - name: Test TypeScript WASM wrapper
        run: node --experimental-strip-types tests/wasm_wrapper.test.mjs

  build-native:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
          - macos-15-intel
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build native artifacts
        shell: bash
        run: zig build -Dtarget=native -Doptimize=ReleaseFast
